# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (twice a day, every 12 hours)
  schedule: [{cron: "0 3,15 * * *"}]
  # Run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zhaoqing-wang
          template: classic
          base: header, repositories, metadata
          base_skip: yes
          config_timezone: Asia/Shanghai
          config_twemoji: yes
          extras_css: |
            /* Header calendar: smooth blue ramp from low to high */
            rect[fill="#ebedf0"] { fill: #198ce7 !important; }
            rect[fill="#9be9a8"] { fill: #1483e3 !important; }
            rect[fill="#40c463"] { fill: #0e79df !important; }
            rect[fill="#30a14e"] { fill: #0970da !important; }
            rect[fill="#216e39"] { fill: #0366d6 !important; }

            /* 3D isocalendar: disable rainbow animation on these paths */
            path[fill="#ebedf0"],
            path[fill="#9be9a8"],
            path[fill="#40c463"],
            path[fill="#30a14e"],
            path[fill="#216e39"] {
              animation: none !important;
            }

            /* 3D isocalendar: top face (no filter) */
            path[fill="#ebedf0"]:not([filter]) { fill: #f0f0f0 !important; }
            path[fill="#9be9a8"]:not([filter]) { fill: #d4d4d4 !important; }
            path[fill="#40c463"]:not([filter]) { fill: #b0b0b0 !important; }
            path[fill="#30a14e"]:not([filter]) { fill: #8a8a8a !important; }
            path[fill="#216e39"]:not([filter]) { fill: #636363 !important; }

            /* 3D isocalendar: left face, original brightness1 — disable filter */
            path[fill="#ebedf0"][filter="url(#brightness1)"] { fill: #d9d9d9 !important; filter: none !important; }
            path[fill="#9be9a8"][filter="url(#brightness1)"] { fill: #bcbcbc !important; filter: none !important; }
            path[fill="#40c463"][filter="url(#brightness1)"] { fill: #9a9a9a !important; filter: none !important; }
            path[fill="#30a14e"][filter="url(#brightness1)"] { fill: #767676 !important; filter: none !important; }
            path[fill="#216e39"][filter="url(#brightness1)"] { fill: #525252 !important; filter: none !important; }

            /* 3D isocalendar: right face, original brightness2 — disable filter */
            path[fill="#ebedf0"][filter="url(#brightness2)"] { fill: #c2c2c2 !important; filter: none !important; }
            path[fill="#9be9a8"][filter="url(#brightness2)"] { fill: #a4a4a4 !important; filter: none !important; }
            path[fill="#40c463"][filter="url(#brightness2)"] { fill: #828282 !important; filter: none !important; }
            path[fill="#30a14e"][filter="url(#brightness2)"] { fill: #5e5e5e !important; filter: none !important; }
            path[fill="#216e39"][filter="url(#brightness2)"] { fill: #3a3a3a !important; filter: none !important; }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%